[project]
name = "surg"
version = "0.1.0"
description = "Data center load volatility and congestion pricing in the PJM DOM zone"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "httpx>=0.27",
    "pyarrow>=14.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "python-dotenv>=1.0",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.scripts]
surg-pull = "surg.acquisition.pull:main"
surg-prep = "surg.preprocessing.build:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
